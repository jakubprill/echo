name: Build

# Tests and the web build run on every change (about a minute on Linux).
# Installers are expensive in minutes (Windows counts 2x in a private repository),
# so they are built on demand only: Actions → Build → Run workflow → choose a platform.
# Windows and Android only for now. macOS (10x) and iOS will come back once there are users:
# desktop.yml accepts os: macos-latest with args/targets for universal-apple-darwin.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        type: choice
        default: android
        options: [android, windows, all, none]
  pull_request:
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/*.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Tests and web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: echo-web
          path: app/dist

  windows:
    name: Windows
    needs: test
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["windows","all"]'), inputs.platform)
    uses: ./.github/workflows/desktop.yml
    with:
      os: windows-latest

  android:
    name: Android (APK)
    needs: test
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["android","all"]'), inputs.platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Android SDK and NDK are preinstalled on ubuntu-latest.
      - name: Point to the NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx tauri android init --ci
      # The debug build is signed with the debug key, so it can be installed straight from the file.
      - run: npx tauri android build --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: echo-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

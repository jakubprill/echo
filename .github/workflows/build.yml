name: Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/build.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/build.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Testy i wersja web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: echo-web
          path: app/dist

  desktop:
    name: ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
          - name: macOS (Intel + Apple Silicon)
            os: macos-latest
            args: "--target universal-apple-darwin"
            targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }} --ci
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: echo-${{ matrix.os }}
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg

  android:
    name: Android (APK)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK i NDK są preinstalowane na ubuntu-latest.
      - name: Wskaż NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx tauri android init --ci
      # Wersja debug jest podpisana kluczem debug, więc da się ją zainstalować prosto z pliku.
      - run: npx tauri android build --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: echo-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

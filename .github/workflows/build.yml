name: Build

# Testy i wersja web budują się przy każdej zmianie (ok. 1 minuty na Linuksie).
# Instalatory są drogie w minutach (Windows liczy się 2x w repozytorium prywatnym),
# więc buduje się je tylko ręcznie: Actions → Build → Run workflow → wybór platformy.
# Na razie tylko Windows i Android. macOS (10x) i iOS wrócą, gdy znajdą się odbiorcy:
# desktop.yml przyjmuje os: macos-latest z args/targets dla universal-apple-darwin.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Co zbudować"
        type: choice
        default: android
        options: [android, windows, all, none]
  pull_request:
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/*.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "examples/**"
      - ".github/workflows/*.yml"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  test:
    name: Testy i wersja web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: echo-web
          path: app/dist

  windows:
    name: Windows
    needs: test
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["windows","all"]'), inputs.platform)
    uses: ./.github/workflows/desktop.yml
    with:
      os: windows-latest

  android:
    name: Android (APK)
    needs: test
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["android","all"]'), inputs.platform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK i NDK są preinstalowane na ubuntu-latest.
      - name: Wskaż NDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - run: npm ci
      - run: npx tauri android init --ci
      # Wersja debug jest podpisana kluczem debug, więc da się ją zainstalować prosto z pliku.
      - run: npx tauri android build --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: echo-android-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
